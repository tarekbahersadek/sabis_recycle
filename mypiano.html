<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My piano</title>
    <link rel="stylesheet" href="mypiano.css">
</head>
<body>
   
    <body>

    <div class="piano-container">

        <h1>🎹 My 61-Key Piano</h1>

        <p>
            Click the keys or use your computer keyboard
        </p>


        <!-- ============================= -->
        <!-- PIANO -->
        <!-- ============================= -->

        <div class="piano">

            <div class="keys" id="pianoKeys">

                <!--
                    JavaScript will automatically
                    create all 61 piano keys here.
                -->

            </div>

        </div>


        <!-- ============================= -->
        <!-- INSTRUCTIONS -->
        <!-- ============================= -->

        <div class="instructions">

            <p>
                🎵 White keys: A S D F G H J K L
            </p>

            <p>
                🎵 Black keys: W E T Y U I O
            </p>

        </div>

    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>

</body>

</body>
